name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  client-build:
    name: client-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: Client
      - run: pnpm build
        working-directory: Client

  functions-build:
    name: functions-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: Server/functions/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: Server/functions
      - run: yarn build
        working-directory: Server/functions
